name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: event_planner }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --prefix backend
      - run: node backend/seed.js && psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_governed_event_control.sql
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/event_planner", DB_HOST: localhost, DB_PORT: 5432, DB_NAME: event_planner, DB_USER: postgres, DB_PASSWORD: postgres, JWT_SECRET: "ci-only-secret-at-least-32-characters" }
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: bash -n start.sh scripts/*.sh
